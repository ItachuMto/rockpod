name: Build Rockpod for iPod Video

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ make zip libsdl1.2-dev \
            texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev \
            libtool libtool-bin automake autoconf pkg-config curl

      - name: Build ARM toolchain
        run: |
          echo "a" | tools/rockboxdev.sh
          # Exportar todas las rutas posibles donde rockboxdev instala los ejecutables
          for dir in /usr/local/arm-elf-eabi/bin /usr/local/arm-elf/bin /usr/local/arm/bin; do
            if [ -d "$dir" ]; then
              echo "$dir" >> $GITHUB_PATH
              echo "Toolchain encontrada en: $dir"
            fi
          done

      - name: Build iPod Video Firmware
        run: |
          # Verificar que el compilador este accesible
          which arm-elf-eabi-gcc || which arm-elf-gcc || true
          
          # Crear directorio y configurar manualmente para evitar el bug de sysctl
          mkdir -p build-hw-ipodvideo
          cd build-hw-ipodvideo
          ../tools/configure --target=ipodvideo --type=normal
          make -j$(nproc)
          make zip

      - name: Upload rockbox.zip
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-ipodvideo-custom
          path: build-hw-ipodvideo/*.zip
