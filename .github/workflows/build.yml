name: Build Rockpod for iPod Video

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and ARM toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ make zip libsdl1.2-dev \
            texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev \
            libtool libtool-bin automake autoconf pkg-config curl \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

          # Crear enlaces simbolicos para herramientas estandar
          for tool in gcc g++ cpp ld ar as nm objcopy objdump ranlib strip size; do
            if which arm-none-eabi-$tool >/dev/null 2>&1; then
              sudo ln -sf $(which arm-none-eabi-$tool) /usr/local/bin/arm-elf-eabi-$tool
              sudo ln -sf $(which arm-none-eabi-$tool) /usr/local/bin/arm-elf-$tool
            fi
          done

          # Crear enlaces especificos para envoltorios LTO/GCC de binutils que Rockbox invoca
          sudo ln -sf $(which arm-none-eabi-ar) /usr/local/bin/arm-elf-eabi-gcc-ar
          sudo ln -sf $(which arm-none-eabi-ar) /usr/local/bin/arm-elf-gcc-ar
          sudo ln -sf $(which arm-none-eabi-nm) /usr/local/bin/arm-elf-eabi-gcc-nm
          sudo ln -sf $(which arm-none-eabi-nm) /usr/local/bin/arm-elf-gcc-nm
          sudo ln -sf $(which arm-none-eabi-ranlib) /usr/local/bin/arm-elf-eabi-gcc-ranlib
          sudo ln -sf $(which arm-none-eabi-ranlib) /usr/local/bin/arm-elf-gcc-ranlib

      - name: Verify Toolchain
        run: |
          which arm-elf-eabi-gcc
          which arm-elf-eabi-gcc-ar
          arm-elf-eabi-gcc-ar --version

      - name: Build iPod Video Firmware
        run: |
          mkdir -p build-hw-ipodvideo
          cd build-hw-ipodvideo
          echo "64" | ../tools/configure --target=ipodvideo --type=normal
          make -j$(nproc)
          make zip

      - name: Upload rockbox.zip
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-ipodvideo-custom
          path: build-hw-ipodvideo/*.zip
